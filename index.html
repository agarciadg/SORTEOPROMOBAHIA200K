<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sorteo Promobahia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo-pb-fondo-blanco.png" alt="Promobahia" id="logo">
        <h1>Sorteo Oficial</h1>
    </header>

    <section id="sorteo">
        <button onclick="sortear()">¡Generar Ganador!</button>
        <div id="resultado"></div>
    </section>

    <section id="lista">
        <h2>Participantes</h2>
        <table id="tabla-participantes">
            <thead>
                <tr><th>Nombre</th><th>Tickets</th><th>Números</th></tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
